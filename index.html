<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoVisualized</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #050510;
      color: #fff;
    }

    .particle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: radial-gradient(#ffffff, rgba(255, 255, 255, 0));
      border-radius: 50%;
      opacity: 0.6;
      animation: float 12s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
        opacity: 0.2;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        transform: translate(var(--tx), var(--ty));
        opacity: 0.1;
      }
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.2em;
      background-color: #fff;
      margin-left: 4px;
      animation: blink 0.8s steps(2, start) infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    .main-title {
      font-size: clamp(1.2rem, 4vw, 2.8rem);
      white-space: nowrap;
    }

    .type-text {
      display: inline;
    }

    .type-break {
      display: none;
    }

    #typeText {
      white-space: pre-line;
    }

    @media (max-width: 768px) {
      .main-title {
        font-size: clamp(1rem, 5vw, 1.5rem);
        white-space: normal;
        max-width: 90vw;
        word-break: break-all;
        line-height: 1.4;
      }

      .type-text {
        display: none;
      }

      .type-break {
        display: inline;
      }

      .btn-primary-custom,
      .btn-secondary-custom {
        padding: 8px 20px;
        font-size: 0.9rem;
      }

      .tag {
        font-size: 0.8rem;
        padding: 4px 12px;
      }

      .container {
        padding: 0 15px;
      }
    }

    @media (max-width: 480px) {
      .main-title {
        font-size: 1rem;
        line-height: 1.5;
      }

      .navbar-brand {
        font-size: 1.1rem;
      }
    }

    .btn-primary-custom {
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-weight: 500;
    }

    .btn-secondary-custom {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 28px;
      color: #fff;
      font-weight: 500;
    }

    .btn-secondary-custom:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.9rem;
      color: #ddd;
    }
  </style>
</head>

<body>
  <div class="particle-bg" id="particleBox"></div>

  <nav class="navbar navbar-dark bg-transparent py-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">AlgoVisualized</span>
      <div class="d-flex gap-3">
        <button class="btn btn-link text-white p-0 fs-5">
          <i class="bi bi-gear"></i>
        </button>
        <button class="btn btn-link text-white p-0 fs-5">
          <i class="bi bi-github"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container vh-100 d-flex flex-column justify-content-center align-items-center text-center">
    <h1 class="main-title mb-5 fw-light">
      <span id="typeText"></span>
      <span class="cursor"></span>
    </h1>

    <div class="d-flex gap-4 mb-5 flex-wrap justify-content-center">
      <button class="btn btn-primary-custom">
        <a href="./data_structure/index.html" target="_blank" class="text-white text-decoration-none" role="button">
          开始阅读
        </a>
      </button>
    </div>

    <div class="d-flex flex-wrap gap-3 justify-content-center">
      <span class="tag">C++ / Java / Python</span>
      <span class="tag">模板 + 可视化</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const particleBox = document.getElementById('particleBox');
    const starCount = 60;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      const size = Math.random() * 6 + 2;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;

      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;

      const tx = (Math.random() - 0.5) * 200;
      const ty = (Math.random() - 0.5) * 200;
      star.style.setProperty('--tx', `${tx}px`);
      star.style.setProperty('--ty', `${ty}px`);

      star.style.animationDuration = `${Math.random() * 8 + 8}s`;
      star.style.animationDelay = `${Math.random() * 5}s`;

      particleBox.appendChild(star);
    }

    const targetText = 'AlgoVisualized，给你带来可视化的算法。';
    const textDom = document.getElementById('typeText');
    const cursorDom = document.querySelector('.cursor');
    let charIndex = 0;
    let isDelete = false;
    function isMobile() {
      return window.innerWidth <= 768;
    }
    function typeEffect() {
      if (isMobile()) {
        textDom.innerText = 'AlgoVisualized\n给你带来可视化的算法';
        if (cursorDom) cursorDom.style.display = 'none';
        return;
      }
      if (cursorDom) cursorDom.style.display = 'inline-block';
      if (!isDelete) {
        textDom.innerText = targetText.slice(0, charIndex + 1);
        charIndex++;
        if (charIndex >= targetText.length) {
          setTimeout(() => {
            isDelete = true;
          }, 1500);
        }
      } else {
        textDom.innerText = targetText.slice(0, charIndex - 1);
        charIndex--;
        if (charIndex <= 0) {
          isDelete = false;
        }
      }
      setTimeout(typeEffect, 120);
    }

    typeEffect();
    window.addEventListener('resize', () => {
      if (isMobile()) {
        textDom.innerText = 'AlgoVisualized\n给你带来可视化的算法';
        if (cursorDom) cursorDom.style.display = 'none';
      } else if (cursorDom) {
        cursorDom.style.display = 'inline-block';
      }
    });
  </script>
</body>

</html>
